[project]
name = "glamira-pipeline"
version = "0.1.0"
description = "Explore Glamira Countly events, geolocate IPs, and crawl product pages"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.13.0",
    "ip2location>=8.11.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pymongo>=4.18.3",
    "requests>=2.32.5",
]

[project.scripts]
glamira-pipeline = "glamira_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
